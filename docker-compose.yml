# Runs the whole site: database, API and client.
#
#   cp .env.docker.example .env.docker   # then fill in your secrets
#   docker compose --env-file .env.docker up --build
#
# Client: http://localhost:5173   API: http://localhost:8800
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env.docker
    environment:
      NODE_ENV: production
      PORT: 8800
    ports:
      - '8800:8800'
    depends_on:
      - mongo

  client:
    build:
      context: ./client
      args:
        VITE_BASEURL: ${VITE_BASEURL:-http://localhost:8800/api/}
        VITE_SUCCESS_URL: ${VITE_SUCCESS_URL:-http://localhost:5173/success}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - api

volumes:
  mongo-data:
