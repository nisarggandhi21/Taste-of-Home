server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Built assets have a hash in their name, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The sitemap lists the dishes on sale, which only the API knows. "api" is the API's name
  # in docker-compose.yml; going through a variable lets nginx start even when it is not up.
  location = /sitemap.xml {
    resolver 127.0.0.11 valid=30s;
    set $api http://api:8800;
    proxy_pass $api/sitemap.xml;
  }

  # Single-page app: every other path is handled by the client-side router.
  location / {
    try_files $uri /index.html;
  }
}
