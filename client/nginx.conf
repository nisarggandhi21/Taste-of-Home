server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Built assets have a hash in their name, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: every other path is handled by the client-side router.
  location / {
    try_files $uri /index.html;
  }
}
