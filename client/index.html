<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The tags marked data-rh are the defaults for pages that say nothing else; once the app
      has started it replaces them with each page's own (see src/components/seo/Seo.jsx).
      %SITE_URL% is filled in when the site is built (see vite.config.js).
    -->
    <meta
      data-rh="true"
      name="description"
      content="Taste of Home - Connect with local home cooks and enjoy delicious, authentic homemade food delivered to your doorstep. Join our community of food enthusiasts today!"
    />
    <meta name="author" content="Taste of Home" />
    <meta name="theme-color" content="#c9410d" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Taste of Home" />
    <meta data-rh="true" name="robots" content="index, follow" />

    <!-- Link previews (Open Graph and Twitter) -->
    <meta property="og:site_name" content="Taste of Home" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:title" content="Taste of Home | Homemade Food Marketplace" />
    <meta
      data-rh="true"
      property="og:description"
      content="Savor the perfection of homemade goodness with our expert home cooks. Every bite is a journey of flavor and warmth."
    />
    <meta data-rh="true" property="og:image" content="%SITE_URL%/img/homemadefood.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="Taste of Home | Homemade Food Marketplace" />
    <meta
      data-rh="true"
      name="twitter:description"
      content="Savor the perfection of homemade goodness with our expert home cooks. Every bite is a journey of flavor and warmth."
    />
    <meta data-rh="true" name="twitter:image" content="%SITE_URL%/img/homemadefood.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        padding: 0;
        margin: 0;
      }
    </style>
    <script>
      // Pick the theme before the first paint so the page never flashes the wrong one:
      // the visitor's saved choice, otherwise their system's light/dark setting.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark' && theme !== 'glass') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <title>Taste of Home | Authentic Homemade Food Marketplace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
