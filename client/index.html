<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Taste of Home - Connect with local home cooks and enjoy delicious, authentic homemade food delivered to your doorstep. Join our community of food enthusiasts today!"
    />
    <meta
      name="keywords"
      content="homemade food, home cooked meals, local chefs, food delivery, authentic cuisine, Taste of Home, food marketplace"
    />
    <meta name="author" content="Taste of Home" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Taste of Home | Homemade Food Marketplace" />
    <meta
      property="og:description"
      content="Savor the perfection of homemade goodness with our expert home cooks. Every bite is a journey of flavor and warmth."
    />
    <meta property="og:image" content="/img/homemadefood.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Taste of Home | Homemade Food Marketplace" />
    <meta
      property="twitter:description"
      content="Savor the perfection of homemade goodness with our expert home cooks. Every bite is a journey of flavor and warmth."
    />
    <meta property="twitter:image" content="/img/homemadefood.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        padding: 0;
        margin: 0;
      }
    </style>
    <script>
      // Pick the theme before the first paint so the page never flashes the wrong one:
      // the visitor's saved choice, otherwise their system's light/dark setting.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark' && theme !== 'glass') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <title>Taste of Home | Authentic Homemade Food Marketplace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
